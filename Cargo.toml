# ClipboardBoard 的最小 Rust + Slint 桌面应用配置。
[package]
name = "clipboard-board"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "轻量 Windows 剪贴板工作台"
license = "MIT"

[dependencies]
blake3 = "1.8.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
slint = "1.16.0"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[build-dependencies]
slint-build = "1.16.0"
winres = "0.1.12"

# 仅用于隔离集成测试，验证 Slint 事件循环的线程投递边界；生产程序不依赖测试后端。
[dev-dependencies]
i-slint-backend-testing = { version = "=1.17.1", features = ["renderer-software"] }

# 仅在 Windows 目标启用原生消息窗口和全局热键 API，避免其他平台拉入无用依赖。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
