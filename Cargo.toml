# ClipboardBoard 的最小 Rust + Slint 桌面应用配置。
[package]
name = "clipboard-board"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "轻量 Windows 剪贴板工作台"
license = "MIT"

[dependencies]
slint = "1.16.0"

[build-dependencies]
slint-build = "1.16.0"

# 仅用于隔离集成测试，验证 Slint 事件循环的线程投递边界；生产程序不依赖测试后端。
[dev-dependencies]
i-slint-backend-testing = "=1.17.1"

# 仅在 Windows 目标启用原生消息窗口和全局热键 API，避免其他平台拉入无用依赖。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
